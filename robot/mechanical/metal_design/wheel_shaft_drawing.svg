<text x="980" y="364" font-size="17">REAR FLANGE FACE / DIA 14</text><text x="980" y="391" font-size="17">6 x DIA 2.2 ON PCD 10.5</text>
<text x="60" y="474" font-size="17">1. One-piece steel flange + shoulder + shaft. Material candidate: C45 / 1045; no purchased material certification.</text>
<text x="60" y="507" font-size="17">2. Six open DIA 4.2 shoulder scallops allow screw-head insertion and tool access; see STEP for true 3D profile.</text>
<text x="60" y="540" font-size="17">3. Rear centre relief DIA 6 x 2 deep clears factory screw. Confirm real S288 central head before machining.</text>
<text x="60" y="573" font-size="17">4. Axial end: M3 x 0.5 blind tapped hole, usable thread at least 9mm; drill depth / tip allowance to be detailed.</text>
<text x="60" y="606" font-size="17">   CAD uses a DIA 3.05 thread-major CLEARANCE representation: DO NOT machine it as a plain DIA 3.05 hole.</text>
<text x="60" y="639" font-size="17">5. Journal fits, runout and perpendicularity must be specified against purchased 686ZZ bearings before release.</text>
<text x="60" y="672" font-size="17">   CAD journal DIA 5.98 is the trial geometry, not a universal tolerance. Inspect 0.15mm housing end clearances.</text>
<text x="60" y="705" font-size="17">6. Spacers: metal tube OD8 / ID6.1, L4.5 and L10, quantity2 each. Square ends; match stack without bearing preload.</text>
<text x="60" y="738" font-size="17">7. PA12 double-D coupon first. Check both rotation directions, end-screw locking, creep, alignment and load.</text>
<text x="60" y="771" font-size="17">8. This drawing omits chamfers/thread helices. Factory plastic flange pull-out, fatigue and impact remain untested.</text>
</g></svg>