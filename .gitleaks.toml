[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
description = "Numerical harness candidate array identifiers"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"(?:array_key|key)"\s*:\s*"(?:radial_and_height_[0-9]+_[0-9]+|upper_fan_delayed_pin[0-9]+_[0-9]+|pin[0-9]+_(?:lead[0-9.]+|r[0-9.]+_z[0-9.]+))"[,]?\s*$''']
paths = [
  '''^mechanical/studies/prearrival_finish/harness_A8/assembly_feed_v3/history_feed_only/relaxation_raw_screen\.json$''',
  '''^mechanical/studies/prearrival_finish/harness_A8/assembly_feed_v3/history_initial_storage_fins/relaxation_raw_screen\.json$''',
  '''^mechanical/studies/prearrival_finish/harness_A8/assembly_feed_v3/open_mouth/relaxation_screen\.json$''',
  '''^mechanical/studies/prearrival_finish/harness_A8/assembly_feed_v3/relaxation_raw_screen\.json$''',
  '''^mechanical/studies/prearrival_finish/harness_A8/assembly_feed_v3/relaxation_screen\.json$''',
  '''^mechanical/studies/prearrival_finish/head_harness_M1_49/cam_joined_verification\.json$''',
  '''^mechanical/studies/prearrival_finish/head_harness_M1_49/remaining_routes/cam_side_fans/fan_screen\.json$''',
  '''^mechanical/studies/prearrival_finish/outer_harness_M1_48/outer_risers\.json$''',
  '''^mechanical/studies/prearrival_finish/outer_harness_M1_48/outer_risers_R10\.json$''',
  '''^mechanical/studies/prearrival_finish/outer_harness_M1_48/outer_risers_R8\.json$''',
]

[[rules.allowlists]]
description = "J6 service-key connector footprint is a component name"
condition = "AND"
regexTarget = "match"
paths = ['''^hardware/v1_2/layout_P4/previews/MORI_motion_P4/placement_native\.csv$''']
regexes = ['''KEY","JST_PH_B2B-PH-K_1x02_P2\.00mm_Vertical__P4_PH_ANNULUS"''']

[[rules.allowlists]]
description = "Historical simulated command UUID in a Python KeyError"
condition = "AND"
regexTarget = "match"
paths = ['''^reports/v1/result_history_before\.log$''']
regexes = ['''^KeyError: '[a-f0-9]{32}'$''']
