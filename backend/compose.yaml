name: mori-v1
services:
  gateway:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes: [mori-data:/data]
    expose: ['8765']
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
  proxy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    env_file: .env
    ports: ['443:443', '80:80']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../apps/console/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      gateway: {condition: service_healthy}
    restart: unless-stopped
volumes:
  mori-data:
  caddy-data:
  caddy-config:
