:root{font:16px/1.6 system-ui,sans-serif;color:#172633;background:#f0f3f5}body{max-width:1400px;margin:0 auto;padding:28px}h1{font-size:28px;margin-bottom:8px}h2{font-size:20px}p{max-width:1000px}a{color:#165e83}button{font:inherit;border:1px solid #bdcdd6;border-radius:8px;padding:7px 14px;cursor:pointer;background:white}button[aria-pressed=true]{background:#183e53;color:white}nav{position:sticky;top:0;background:#f0f3f5ed;padding:12px 0;z-index:2;display:flex;gap:8px;flex-wrap:wrap}section{background:white;border:1px solid #d6dfe5;border-radius:14px;margin:20px 0;padding:20px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0;min-width:0}figcaption{font-weight:650;margin:4px 0}img{width:100%;display:block;background:#10151c;border-radius:8px;min-height:140px;max-height:660px;object-fit:contain}small{color:#4b6370}.links{display:flex;flex-wrap:wrap;gap:18px}.tag{color:#8b562b;font-weight:650}@media(max-width:760px){body{padding:12px}.pair{grid-template-columns:1fr}}
</style><body><h1>MORI 运动板 P5R1：七处圈选对比</h1><p>两列为相同位置、相同尺度的 KiCad 原生导出，底层保持正面坐标方向，方便与圈选截图逐一对应。覆铜只在临时查看副本中隐藏；工程中的覆铜与规则完整保留。</p><p class="tag">PROTOTYPE · 未台架验证。DRC 通过与布线外观验收分别记录。</p><div class="links"><a href="../kicad/MORI_motion_P5R1/MORI_motion_P5R1.kicad_pro">原生 KiCad 工程</a><a href="../kicad/MORI_motion_P5R1/MORI_motion_P5R1.kicad_pcb">原生 PCB</a><a href="README.md">修改说明与检查</a><a href="previews/MORI_motion_P5R1.pdf">原理图 PDF</a></div><nav><button data-layer="auto">按圈选重点显示</button><button data-layer="combined">正反面叠加</button><button data-layer="front">仅正面铜</button><button data-layer="back">仅背面铜</button></nav><main id="panels"></main><section><h2>全板查看</h2><div class="pair"><figure><figcaption>P5</figcaption><a href="previews/before/combined.svg"><img src="previews/before/combined.png"></a></figure><figure><figcaption>P5R1</figcaption><a href="previews/after/combined.svg"><img src="previews/after/combined.png"></a></figure></div></section><script>const regions=[{"mark": "A", "title": "U5.1 / ARM_CLK", "layer": "back", "note": "引脚改为先向外引出，在上方分支；不再贴着芯片边沿横接。"}, {"mark": "B", "title": "J1/J2/J7 / 5V、FAULT_N、CHG_N", "layer": "combined", "note": "5V 端点对齐；两条状态线整段重画，去掉短错位和绕 C8 的局部凸起。"}, {"mark": "C", "title": "U3.3 → U2.1 / HEAD_OE_N", "layer": "back", "note": "合并 0.0556 mm 错位的竖线，使用同一中心线。"}, {"mark": "D", "title": "U2.5 / HEAD_BUS", "layer": "back", "note": "移动过孔，使用一条竖直通道和一次引脚入口转向，删除连续小台阶。"}, {"mark": "E", "title": "U2.8 / C2 去耦供电", "layer": "back", "note": "C2 向 U2 移动 0.25 mm；电源先向外走，供电过孔放在明确的转角，地线对齐。旋转方案未采用。"}, {"mark": "F", "title": "U2.3 → U100.A14 / HEAD_RX", "layer": "combined", "note": "换层点移近 U2，正面直接以 45° 连到 A14，去掉底部横向绕行。"}, {"mark": "G", "title": "J4.3/J4.4 / IMU_SCK、IMU_MOSI", "layer": "combined", "note": "从通孔端子直接走背面，删除重叠折返、两颗过孔及多余短线。"}];const main=document.getElementById('panels');for(const r of regions){const sec=document.createElement('section');sec.innerHTML='<h2>'+r.mark+' · '+r.title+'</h2><p>'+r.note+'</p><div class="pair">'+['before','after'].map(v=>'<figure><figcaption>'+(v==='before'?'修改前 P5':'修改后 P5R1')+'</figcaption><a id="a-'+r.mark+'-'+v+'"><img id="i-'+r.mark+'-'+v+'" alt="'+r.mark+' '+v+'"></a></figure>').join('')+'</div>';main.append(sec)}function showLayer(layer){for(const r of regions){const l=layer==='auto'?r.layer:layer;for(const v of ['before','after']){const src='previews/'+v+'/'+r.mark+'_'+l+'.svg';document.getElementById('i-'+r.mark+'-'+v).src=src;document.getElementById('a-'+r.mark+'-'+v).href=src}}for(const b of document.querySelectorAll('nav button'))b.setAttribute('aria-pressed',b.dataset.layer===layer)}for(const b of document.querySelectorAll('nav button'))b.onclick=()=>showLayer(b.dataset.layer);showLayer('auto');</script></body></html>
