<!doctype html><html lang=zh><meta charset=utf-8><title>MORI 当前装配步骤</title><style>body{max-width:1000px;margin:30px auto;padding:20px;font:16px/1.7 system-ui;background:#eef0ed;color:#234}figure{margin:25px 0}a{color:#216556}</style><a href=../index.html>返回总装</a><h1>MORI V1.2-M1.23 · Blender 装配动画</h1><p>本轮更新可编辑动画与18张分步渲染；旧MP4是M1.22历史文件，不代表当前电路板。</p><a href=../mori_assembly_animation.blend>当前动画 Blender</a><p>动画仅作顺序讲解；未验证连续装配路径、手部和真实线束。</p><figure><img style="width:100%;max-width:800px" src="step_01.png?revision=V1.2-M1.23"><figcaption>01 · 轮驱分总成 · S288 ×2；保留原配输出盘</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_02.png?revision=V1.2-M1.23"><figcaption>02 · 连接金属法兰轴 · 每侧 6 枚原厂兼容自攻螺钉；金属轴不打印</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_03.png?revision=V1.2-M1.23"><figcaption>03 · 轴承与内隔套 · 内轴承 → 5 mm 金属隔套 → 外轴承</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_04.png?revision=V1.2-M1.23"><figcaption>04 · 装入轮驱上座 · 两套电机 / 轴 / 轴承组件由下方进入</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_05.png?revision=V1.2-M1.23"><figcaption>05 · 固定共用底盖 · 上下座夹持；4 枚 M3 螺钉从底面装入</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_06.png?revision=V1.2-M1.23"><figcaption>06 · 主托板与底面电路板 · IMU、两块降压板由底面预装；随后固定轮驱连接</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_07.png?revision=V1.2-M1.23"><figcaption>07 · 板卡与电源安装座 · P5R2 实际装件；电源四矮座 + 对角 M2×6</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_08.png?revision=V1.2-M1.23"><figcaption>08 · 插接固定 Yaw 承重桥 · 内侧预装螺母；桥脚插入托板，两侧 M3×8 锁紧</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_09.png?revision=V1.2-M1.23"><figcaption>09 · 电池托盘与电池 · 加宽托盘沿前方滑入；底部承托，左右 M2 限位</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_10.png?revision=V1.2-M1.23"><figcaption>10 · Yaw 承重组件 · 反力轴先穿入 U 托；整体落入轴承后固定</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_11.png?revision=V1.2-M1.23"><figcaption>11 · 水平与俯仰驱动 · 倒置 Yaw 舵机 + 侧置 Pitch 舵机</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_12.png?revision=V1.2-M1.23"><figcaption>12 · 双侧支撑与头托 · 先定位头托，再从两侧插入支撑轴</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_13.png?revision=V1.2-M1.23"><figcaption>13 · 显示与摄像头 · 圆屏和摄像头独立；CAM 板载双麦，无打印导管</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_14.png?revision=V1.2-M1.23"><figcaption>14 · 线束与头壳 · 服务环按当前路径示意；前后壳合拢</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_15.png?revision=V1.2-M1.23"><figcaption>15 · 上壳附件台面预装 · 原生后接口板固定到壳；开关外部操作仍待改版</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_16.png?revision=V1.2-M1.23"><figcaption>16 · 机身合装 · 从附件预装切换到总装姿态；下壳由底部合入</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_17.png?revision=V1.2-M1.23"><figcaption>17 · 安装车轮 · 外隔套 → 轮胎 / 轮毂 → 垫圈与端螺钉</figcaption></figure><figure><img style="width:100%;max-width:800px" src="step_18.png?revision=V1.2-M1.23"><figcaption>18 · 装配完成 · 当前设计 · 尺寸沿用 V1.2-M1.23；实物配合与装配工艺待验证</figcaption></figure></html>
