<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">S288 连接线测量示意</title><desc id="desc">已知导线段约190毫米，不含两端插头。A是插头完全插入后，从电机插座口到插头塑壳尾端的外伸长度，B是单根绝缘导线的外径，用户估计约1毫米。图中外形为示意，不代表真实尺寸。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#167887"/></marker></defs>
<rect width="1200" height="820" fill="#fafbf9"/>
<g font-family="system-ui, -apple-system, sans-serif" fill="#253337">
<text x="50" y="59" font-size="30" font-weight="600">线径已记录，外伸量仍留待测量</text>
<text x="50" y="96" font-size="19" fill="#626e70">示意图，非实际插头轮廓；保持断电，不用拆线或剥皮。</text>
<text x="50" y="158" font-size="25" font-weight="600">A · 插到底后，塑壳外伸多少？</text>
<rect x="85" y="225" width="230" height="190" rx="9" fill="#8c999b"/>
<path d="M 315 280 H 366 V 360 H 315" fill="#d3dadd" stroke="#647276" stroke-width="3"/>
<rect x="333" y="294" width="174" height="52" fill="#edd5a3" stroke="#986b22" stroke-width="3"/>
<path d="M 507 309 H 675 M 507 320 H 675 M 507 331 H 675" stroke="#926b37" stroke-width="6"/>
<text x="130" y="273" font-size="22" fill="white">电机</text>
<text x="170" y="458" font-size="21">插座口</text><path d="M 269 445 L 366 375" fill="none" stroke="#647276" stroke-width="2"/>
<text x="439" y="458" font-size="21">塑壳尾端</text><path d="M 513 437 L 507 360" fill="none" stroke="#647276" stroke-width="2"/>
<path d="M 366 290 V 216 M 507 290 V 216" fill="none" stroke="#167887" stroke-width="2"/>
<path d="M 373 230 H 500" fill="none" stroke="#167887" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="397" y="207" font-size="23" fill="#167887">A：待量</text>
<text x="770" y="158" font-size="25" font-weight="600">B · 单根线有多粗？</text>
<circle cx="943" cy="305" r="57" fill="#9b7345"/>
<circle cx="943" cy="305" r="30" fill="#d4ad69"/>
<path d="M 886 311 V 399 M 1000 311 V 399" fill="none" stroke="#167887" stroke-width="2"/>
<path d="M 892 380 H 994" fill="none" stroke="#167887" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="878" y="433" font-size="23" fill="#167887">B：约 1 mm</text>
<text x="802" y="466" font-size="20">单根含绝缘皮；用户估计值</text>
<path d="M 50 513 H 1150" stroke="#cdd5d4"/>
<text x="50" y="565" font-size="25" font-weight="600">已记录 · 导线段约 190 mm，不含两端插头</text>
<rect x="135" y="612" width="120" height="56" rx="4" fill="#edd5a3" stroke="#986b22" stroke-width="2"/>
<rect x="945" y="612" width="120" height="56" rx="4" fill="#edd5a3" stroke="#986b22" stroke-width="2"/>
<path d="M 255 629 H 945 M 255 640 H 945 M 255 651 H 945" stroke="#926b37" stroke-width="5"/>
<path d="M 255 671 V 724 M 945 671 V 724" fill="none" stroke="#167887" stroke-width="2"/>
<path d="M 263 708 H 937" stroke="#167887" stroke-width="2.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="536" y="749" font-size="23" fill="#167887">约 190 mm</text>
<text x="50" y="790" font-size="18" fill="#626e70">已记录“插头几乎完全藏入舵机”；这是定性观察，不能把 A 直接填成 0 mm。</text>
</g></svg>